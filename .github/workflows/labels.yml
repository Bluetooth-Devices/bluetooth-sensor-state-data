name: Sync Github labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Create or update every label in labels.toml. Labels missing from
      # the file are left alone (e.g. dependabot's "python" label).
      - name: Sync config with Github
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import subprocess
          import tomllib

          with open(".github/labels.toml", "rb") as f:
              labels = tomllib.load(f)
          for label in labels.values():
              subprocess.run(
                  [
                      "gh", "label", "create", label["name"],
                      "--color", label["color"],
                      "--description", label["description"],
                      "--force",
                  ],
                  check=True,
              )
